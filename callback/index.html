<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực TikTok Thành Công • FEDU Video Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060911;
      --card: #0c121e;
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .code-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--cyan);
      word-break: break-all;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Xác thực TikTok Thành Công!</h1>
    <p>Tài khoản TikTok của bạn đã cấp quyền thành công cho ứng dụng <b>FEDU Video Manager</b>.</p>
    
    <div id="code-container" style="display:none;">
      <div style="font-size:12px; color:var(--muted); margin-bottom:6px; text-align:left;">MÃ XÁC THỰC (AUTH CODE):</div>
      <div id="auth-code" class="code-box"></div>
      <button class="btn" onclick="copyCode()">Sao chép Mã Xác Thực</button>
    </div>
    <div id="no-code" style="color:var(--muted); font-size:14px;">
      Bạn có thể quay lại terminal / Antigravity để tiếp tục tiến trình.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code-container').style.display = 'block';
      document.getElementById('no-code').style.display = 'none';
      document.getElementById('auth-code').innerText = code;
    }

    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        alert('Đã sao chép mã code vào clipboard!');
      });
    }
  </script>
</body>
</html>
