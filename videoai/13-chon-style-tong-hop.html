];

let state = {
  tab: 'sub',
  sub: 'S01',
  hero: 'H01',
  frame: 'F01',
  motion: 'M01',
  bg: 'wide'
};

function loadFromHash() {
  const h = window.location.hash.replace('#', '');
  if (!h) return;
  const params = new URLSearchParams(h);
  if (params.get('sub')) state.sub = params.get('sub');
  if (params.get('hero')) state.hero = params.get('hero');
  if (params.get('frame')) state.frame = params.get('frame');
  if (params.get('motion')) state.motion = params.get('motion');
}

function saveToHash() {
  const hash = `sub=${state.sub}&hero=${state.hero}&frame=${state.frame}&motion=${state.motion}`;
  history.replaceState(null, '', '#' + hash);
  document.getElementById('summaryCode').textContent = `SUB:${state.sub} · MỞ ĐẦU:${state.hero} · KHUNG:${state.frame} · ZOOM:${state.motion}`;
  const demoBtn = document.getElementById('goToDemoBtn');
  if (demoBtn) demoBtn.href = `/demo/hien-halong-xanh.html#${hash}`;
}

function setBgMode(mode) {
  state.bg = mode;
  document.querySelectorAll('.bg-chip').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('bg-' + mode);
  if (btn) btn.classList.add('active');
  const img = document.getElementById('stageBgImg');
  if (!img) return;
  if (mode === 'wide') {
    img.src = '/assets/demo_hien/raw_aroll_wide.webp';
    img.style.transform = 'scale(1)';
  } else if (mode === 'zoom') {
    img.src = '/assets/demo_hien/raw_aroll_zoom.webp';
    img.style.transform = 'scale(1.04)';
  } else {
    img.src = '/assets/demo_hien/frame_slot1_map.webp';
    img.style.transform = 'scale(1)';
  }
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderGrid();
}

function updateLivePreview() {
  const s = SUB_STYLES.find(x => x.id === state.sub) || SUB_STYLES[0];
  const h = HERO_STYLES.find(x => x.id === state.hero) || HERO_STYLES[0];

  const heroZone = document.getElementById('heroPreviewZone');
  heroZone.innerHTML = h.html;

  const cap = document.getElementById('subCapsule');
  const topBar = document.getElementById('subTopBar');
  const l1 = document.getElementById('subLine1');
  const l2 = document.getElementById('subLine2');

  cap.style.background = s.capsuleBg;
  cap.style.border = s.border;
  topBar.style.background = s.topBar;

  const kwStyle = `color:${s.kwColor};text-shadow:${s.kwShadow};background:${s.kwBg};${s.kwBg !== 'transparent' ? 'padding:2px 8px;border-radius:6px;display:inline-block;' : ''}`;

  l1.innerHTML = `<span class="sub-norm" style="color:${s.normColor}">Siêu dự án </span><span class="sub-kw" style="${kwStyle}">4.110 ha</span><span class="sub-norm" style="color:${s.normColor}"> lớn gấp</span>`;
  l2.innerHTML = `<span class="sub-norm" style="color:${s.normColor}">gần 10 lần </span><span class="sub-kw" style="${kwStyle}">Vinhomes Ocean Park</span>`;
}

function selectItem(id) {
  if (state.tab === 'sub') state.sub = id;
  else if (state.tab === 'hero') state.hero = id;
  else if (state.tab === 'frame') {
    state.frame = id;
    if (id === 'F01' || id === 'F02' || id === 'F03') setBgMode('map');
  } else if (state.tab === 'motion') {
    state.motion = id;
    if (id === 'M01' || id === 'M06') setBgMode('zoom');
  }
  saveToHash();
  updateLivePreview();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('cardsGrid');
  let list = SUB_STYLES;
  let activeId = state.sub;
  if (state.tab === 'hero') { list = HERO_STYLES; activeId = state.hero; }
  else if (state.tab === 'frame') { list = FRAME_STYLES; activeId = state.frame; }
  else if (state.tab === 'motion') { list = MOTION_STYLES; activeId = state.motion; }

  grid.innerHTML = list.map(item => `
    <div class="style-card ${item.featured ? 'featured-full' : ''} ${item.id === activeId ? 'active' : ''}" onclick="selectItem('${item.id}')">
      <div class="card-top">
        <span class="card-code">${item.id}</span>
        <span class="card-badge ${item.badgeClass}">${item.badge}</span>
      </div>
      <div class="card-name">${item.name}</div>
      <div class="card-micro">${item.micro}</div>
    </div>
  `).join('');
}

function copySelection() {
  const msg = `CHỐT STYLE VIDEO AI: Phụ đề=${state.sub} | Mở đầu=${state.hero} | Khung=${state.frame} | Motion=${state.motion}`;
  navigator.clipboard.writeText(msg).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Đã Copy!';
    btn.style.background = '#10B981';
    btn.style.color = '#FFF';
    setTimeout(() => {
      btn.textContent = 'Chốt & Copy';
      btn.style.background = 'var(--gold)';
      btn.style.color = '#090C10';
    }, 2000);
  });
}

loadFromHash();
saveToHash();
updateLivePreview();
renderGrid();
</script>
