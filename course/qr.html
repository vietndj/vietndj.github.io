<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Code Thanh Toán - Sale</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%2307090E'/%3E%3Cpath%20d='M13.4%2047.4Q12.5%2047.4%2012.5%2046.5V20.6H9.8Q8.9%2020.6%208.9%2019.7V15.4Q8.9%2014.5%209.8%2014.5H22.7Q23.6%2014.5%2023.6%2015.4V19.7Q23.6%2020.6%2022.7%2020.6H19.9V46.5Q19.9%2047.4%2019%2047.4ZM34.7%2014Q37.6%2014%2039.4%2014.6Q41.1%2015.3%2042%2016.3Q43%2017.4%2043.3%2018.7Q43.6%2019.9%2043.6%2021.3V40.6Q43.6%2041.7%2043.4%2042.8Q43.2%2043.8%2042.6%2044.8Q42%2045.7%2041%2046.4Q40%2047.1%2038.3%2047.5L40.1%2052.1Q40.3%2052.5%2040%2052.8Q39.7%2053%2039.2%2053H33.9Q33.5%2053%2033.3%2052.8Q33.1%2052.5%2033%2052.1L31.9%2047.6Q30%2047.3%2028.8%2046.6Q27.6%2045.9%2027%2044.9Q26.3%2044%2026.1%2042.9Q25.8%2041.7%2025.8%2040.6V21.3Q25.8%2019.9%2026.2%2018.7Q26.5%2017.4%2027.4%2016.3Q28.4%2015.3%2030.1%2014.6Q31.9%2014%2034.7%2014ZM33.2%2040Q33.2%2040.8%2033.6%2041.2Q33.9%2041.7%2034.7%2041.7Q35.6%2041.7%2035.9%2041.2Q36.3%2040.8%2036.3%2040V21.9Q36.3%2021.1%2035.9%2020.6Q35.6%2020.2%2034.7%2020.2Q33.9%2020.2%2033.6%2020.6Q33.2%2021.1%2033.2%2021.9Z'%20fill='%23F59E0B'/%3E%3Ccircle%20cx='52'%20cy='13'%20r='4.2'%20fill='%23F59E0B'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .bg-custom {
            background-color: #FFFAEE; 
            position: relative;
        }
        .coin {
            position: absolute;
            border-radius: 50%;
            background-color: #FDF1D5;
            color: #F8E2A7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 0;
            opacity: 0.8;
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Ẩn scrollbar nhưng vẫn scroll được nếu cần */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 flex h-screen items-center justify-center p-4">

    <div class="flex flex-col md:flex-row gap-8 bg-white p-8 rounded-2xl shadow-xl w-full max-w-4xl">
        <!-- Cột Form Nhập Liệu -->
        <div class="flex-1 flex flex-col gap-5">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Tạo mã QR nhanh</h2>
                <p class="text-gray-500 text-sm mt-1">Dành cho Sale để xuất mã QR thanh toán gửi khách hàng.</p>
            </div>
            
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-2">
                <p class="text-sm text-blue-800 font-medium">Thông tin tài khoản nhận:</p>
                <p class="text-sm text-blue-900 mt-1">Ngân hàng: <b>TPBank</b></p>
                <p class="text-sm text-blue-900">STK: <b>8880 4101 986</b></p>
                <p class="text-sm text-blue-900">Tên: <b>NGUYEN DUC VIET</b></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền (VND)</label>
                <input type="text" id="input-amount" placeholder="Ví dụ: 599,000" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg font-semibold text-gray-800" value="599,000" oninput="formatCurrency(this); updatePreview()">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nội dung chuyển khoản</label>
                <input type="text" id="input-desc" placeholder="Nội dung..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-gray-800" value="c van dk 4 khoa" oninput="updatePreview()">
            </div>
            
            <!-- Hidden Fields for API -->
            <input type="hidden" id="bank-id" value="970423"> <!-- TPBank BIN -->
            <input type="hidden" id="account-no" value="88804101986">
            <input type="hidden" id="account-name" value="NGUYEN DUC VIET">

            <button onclick="downloadImage()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Tải ảnh QR gửi khách
            </button>
            <p id="loading-msg" class="text-sm text-blue-600 hidden text-center font-medium animate-pulse">Đang tạo ảnh, vui lòng đợi chút...</p>
        </div>

        <!-- Cột Preview -->
        <div class="flex-1 flex justify-center items-center bg-gray-50 rounded-xl p-4 border border-dashed border-gray-300">
            <!-- Vùng cần Capture (Ảnh tải về) -->
            <div id="capture-area" class="bg-custom w-[360px] h-[640px] flex flex-col items-center p-8 rounded-[2rem] relative overflow-hidden shadow-sm">
                <!-- Đồng tiền trang trí -->
                <div class="coin" style="width: 150px; height: 150px; bottom: -30px; right: -40px; font-size: 5rem;">$</div>
                <div class="coin" style="width: 80px; height: 80px; bottom: 120px; left: 30px; font-size: 3rem;">$</div>
                <div class="coin" style="width: 30px; height: 30px; bottom: 180px; right: 60px; font-size: 1rem;">$</div>
                <div class="coin" style="width: 40px; height: 40px; top: 70%; right: 30px; font-size: 1.5rem;">$</div>
                
                <div class="content-wrapper">
                    <div class="text-center mt-6">
                        <p class="text-gray-800 text-[15px] mb-1">Quét mã để chuyển tiền đến</p>
                        <p class="font-bold text-gray-900 text-[19px] uppercase tracking-wide leading-tight">NGUYEN DUC VIET</p>
                        <p class="text-gray-800 text-lg mt-0.5">8880 4101 986</p>
                    </div>
                    
                    <div class="mt-7 bg-white p-2.5 rounded-2xl shadow-sm w-full max-w-[250px]">
                        <img id="qr-image" src="" alt="QR Code" class="w-full h-auto rounded-xl">
                    </div>

                    <div class="mt-8 text-center flex flex-col items-center">
                        <p class="text-[22px] font-bold text-gray-900 flex gap-2 items-baseline">
                            VND <span id="display-amount" class="text-blue-500 text-[26px]">599,000</span>
                        </p>
                        <p id="display-desc" class="text-gray-800 mt-2 text-[15px] px-4 text-center max-w-full break-words">c van dk 4 khoa</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let debounceTimer;
        
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            if(val) {
                input.value = new Intl.NumberFormat('en-US').format(val);
            } else {
                input.value = '';
            }
        }

        async function fetchQRBlob(url) {
            const response = await fetch(url);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        function updatePreview() {
            clearTimeout(debounceTimer);
            
            const amountStr = document.getElementById('input-amount').value;
            const amount = amountStr.replace(/,/g, '');
            const desc = document.getElementById('input-desc').value;
            
            // Cập nhật text ngay lập tức
            document.getElementById('display-amount').textContent = amountStr || '0';
            document.getElementById('display-desc').textContent = desc || '';

            // Debounce phần tải ảnh QR mới để tránh gọi API quá nhiều
            debounceTimer = setTimeout(async () => {
                const bankId = document.getElementById('bank-id').value;
                const accNo = document.getElementById('account-no').value;
                const accName = document.getElementById('account-name').value;

                if (!amount) return;

                // API VietQR với template compact2 để lấy QR có sẵn logo TCB và Napas
                const url = `https://img.vietqr.io/image/${bankId}-${accNo}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(desc)}&accountName=${encodeURIComponent(accName)}`;
                
                try {
                    // Dùng blob để html2canvas không bị lỗi CORS khi vẽ canvas
                    const objectURL = await fetchQRBlob(url);
                    document.getElementById('qr-image').src = objectURL;
                } catch (error) {
                    console.error("Lỗi khi tải mã QR:", error);
                    document.getElementById('qr-image').src = url;
                }
            }, 500); 
        }

        async function downloadImage() {
            const btn = document.querySelector('button');
            const msg = document.getElementById('loading-msg');
            
            btn.classList.add('opacity-50', 'pointer-events-none');
            msg.classList.remove('hidden');

            const captureArea = document.getElementById('capture-area');
            
            // Đợi 1 chút để DOM ổn định
            await new Promise(r => setTimeout(r, 100));

            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 2.5, // Tăng độ nét của ảnh xuất ra
                    useCORS: true,
                    backgroundColor: '#FFFAEE',
                    logging: false
                });
                
                const link = document.createElement('a');
                link.download = `QR_TPBank_Sale_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } catch (err) {
                alert("Có lỗi xảy ra khi tạo ảnh. Vui lòng thử lại!");
                console.error(err);
            } finally {
                btn.classList.remove('opacity-50', 'pointer-events-none');
                msg.classList.add('hidden');
            }
        }

        // Initialize first load
        window.onload = () => {
            updatePreview();
        };
    </script>
</body>
</html>
