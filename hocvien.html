<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học Viên Khóa Video — Bối Cảnh Tư Vấn & Kênh Mẫu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#1a73e8',
              600: '#1557bf',
              700: '#0f3f8c',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* Custom clean scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f8fafc] text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.03)]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Brand Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-sm shadow-sm">
          ▶
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900">
            HỌC VIÊN KHÓA VIDEO
          </h1>
          <p class="text-[11px] text-slate-400 font-medium">Bối cảnh tư vấn, video thực hành & kênh mẫu theo ngành</p>
        </div>
      </div>

      <!-- Telegram Button & Quick Link -->
      <div class="flex items-center gap-2.5 text-xs">
        <a 
          href="https://t.me/hocvienhocvideo_bot" 
          target="_blank" 
          class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white font-semibold transition shadow-sm"
        >
          <span>📱 Bot Telegram</span>
          <span class="text-slate-400">↗</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-5">

    <!-- SEARCH & INDUSTRY FILTER BAR (NO BIG STATS) -->
    <div class="p-4 sm:p-5 rounded-3xl bg-white border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.02)] space-y-3.5">
      <!-- Search Input (Pill Style) -->
      <div class="relative">
        <span class="absolute left-4 top-2.5 text-slate-400 text-sm">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Tìm nhanh theo tên học viên, ngành nghề, vướng mắc kỹ thuật, nhận xét Thầy Việt..."
          class="w-full bg-slate-50 border border-slate-200 rounded-full pl-11 pr-5 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition"
        >
      </div>

      <!-- Industry Filter Pills -->
      <div class="flex items-center justify-between flex-wrap gap-2 pt-1 border-t border-slate-100">
        <div class="flex flex-wrap items-center gap-2" id="industry-filter-container">
          <button 
            onclick="filterByIndustry('all')" 
            class="ind-filter-btn active px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-white transition shadow-sm"
            data-ind="all"
          >
            Tất cả ngành (1)
          </button>
          <!-- Injected via JS -->
        </div>

        <div class="text-[11px] text-slate-400 font-medium">
          Hiển thị: <span id="showing-count" class="font-bold text-slate-700">1</span> học viên
        </div>
      </div>
    </div>

    <!-- STUDENT CARDS (WITH PHOTO / VIDEO PREVIEWS) -->
    <div id="students-grid" class="grid grid-cols-1 gap-4">
      <!-- Injected via JS -->
    </div>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="hidden p-12 text-center bg-white rounded-3xl border border-slate-200 shadow-sm">
      <div class="text-3xl mb-2">🔍</div>
      <h3 class="text-sm font-bold text-slate-800">Không tìm thấy học viên phù hợp</h3>
      <p class="text-xs text-slate-400 mt-0.5">Thử xóa từ khóa tìm kiếm hoặc chọn danh mục khác.</p>
    </div>

  </main>

  <!-- SLIDING DRAWER -->
  <div id="drawer-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden transition-opacity" onclick="closeDrawer()"></div>
  <div id="drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-2xl bg-white border-l border-slate-200 z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    
    <!-- Drawer Header -->
    <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-white sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <img id="drawer-avatar" class="w-12 h-12 rounded-full object-cover border border-slate-200 shadow-xs" src="" alt="">
        <div>
          <div class="flex items-center gap-2">
            <h2 id="drawer-name" class="text-lg font-extrabold text-slate-900"></h2>
            <span id="drawer-ind" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-700 border border-blue-200"></span>
          </div>
          <p id="drawer-sub" class="text-xs text-slate-400 mt-0.5 font-medium"></p>
        </div>
      </div>
      <button onclick="closeDrawer()" class="p-2 text-slate-400 hover:text-slate-800 rounded-full hover:bg-slate-100 transition text-base">
        ✕
      </button>
    </div>

    <!-- Drawer Scrollable Content -->
    <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs text-slate-600" id="drawer-body">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-60 hidden items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
    <img id="lightbox-img" class="max-w-full max-h-[92vh] object-contain rounded-2xl shadow-2xl bg-white p-1" src="" alt="Zoom preview">
  </div>

  <!-- SUBTLE FOOTER WITH MINIMAL STATS -->
  <footer class="border-t border-slate-200/70 bg-white py-4 mt-auto">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-400">
      <div class="flex items-center gap-3 font-medium">
        <span>Tổng: <b class="text-slate-600" id="stat-total">1</b></span>
        <span>•</span>
        <span class="text-emerald-600">Đầy đủ: <b id="stat-complete">0</b></span>
        <span>•</span>
        <span class="text-amber-600">Cần bổ sung: <b id="stat-warning">0</b></span>
        <span>•</span>
        <span class="text-rose-600">Thiếu SĐT/FB: <b id="stat-critical">0</b></span>
      </div>
      <div>
        <span>Cập nhật: 06/09/2026 00:06:29</span>
      </div>
    </div>
  </footer>

  <!-- DATA & JAVASCRIPT LOGIC -->
  <script>
    const STUDENTS = [{"id": "van_anh_offline2", "name": "Vân Anh", "class": "Offline 2", "industry": "Spa", "industry_slug": "spa", "avatar_url": "assets/hocvien/vananh_avatar.jpg", "thumbnail_url": "assets/hocvien/thumb_vananh.jpg", "phone": null, "zalo_url": null, "facebook_url": null, "completeness_score": 60, "health_status": "warning", "missing_items": [{"field": "phone", "label": "Số điện thoại / Zalo", "severity": "critical", "hint": "Cần xin số Zalo hoặc SĐT để tiện gọi"}, {"field": "facebook_url", "label": "Link Facebook cá nhân", "severity": "critical", "hint": "Cần lưu link trang cá nhân FB"}], "reference_channels": [{"name": "Reel Lưu Diệu (Kênh mẫu Spa)", "platform": "facebook", "url": "https://www.facebook.com/share/r/1D7ksvGmTV/?mibextid=wwXIfr", "description": "Kênh phong cách video ngắn về spa bạn Vân Anh muốn đi theo (https://www.facebook.com/luu.dieu.352491/reels/)"}], "videos": [{"id": "vid_01", "title": "Video Vân Anh nháp ban đầu", "duration": "00:45", "local_path": "/Users/vietmac/Downloads/van anh.mp4", "drive_url": null, "feedback": "Bản quay thử nghiệm trước khi áp dụng công thức 3 tầng chuẩn.", "created_at": "24/08/2026 16:30"}, {"id": "vid_02", "title": "Video 3 Tầng Chia Sẻ & Cảnh Trám Spa (01:29)", "duration": "01:29", "thumbnail": "assets/hocvien/thumb_vananh.jpg", "local_path": "/Users/vietmac/Downloads/van anh 2.mp4", "drive_url": "https://drive.google.com/open?id=1HP8MrctBb2uhIklvXOi3ZEQxxgbQVo3B", "feedback": "Thầy Việt khen: \"nghe đã thấy hấp dẫn rồi. Chắc chắn là nói dối luônnnn - giọng em hay thế\". Áp dụng công thức 3 tầng, lồng cảnh trám spa tự nhiên và nội dung daily cuộc sống.", "created_at": "24/08/2026 17:02"}], "consultations": [{"id": "cst_01", "date": "24/08/2026 19:18", "channel": "zalo", "topic": "Kỹ thuật thu âm 2 máy & Đồng bộ CapCut PC", "summary": "Thầy Việt hướng dẫn: Chỉ cần 1 máy thu âm giọng nói rõ ràng, máy phụ chỉ cần nghe loáng thoáng để khi đưa vào CapCut PC thì phần mềm tự động dóng hàng sóng âm (Auto-sync by sound). Không cần cắm mic vào cả 2 máy.", "technical_blockers": "Chưa quen quay 2 máy đồng thời, bối rối về việc cắm mic thu tiếng.", "mindset_attitude": "Chăm chú học hỏi, tích cực hỏi kỹ thuật.", "next_steps": "Chờ Vân Anh gửi video thực hành sau khi tự dóng hàng trên CapCut PC để thầy chỉnh nhịp.", "screenshot_url": "tu_van_van_anh_01.png"}, {"id": "cst_02", "date": "24/08/2026 18:04", "channel": "zalo", "topic": "Nhận xét video thực hành 3 tầng & Cảnh trám Spa", "summary": "Vân Anh nộp video thực hành 01:29 xác định làm theo cấu trúc 3 tầng chia sẻ của thầy Việt, cài cắm cảnh trám về Spa tự nhiên, kết hợp nội dung daily về gia đình/con cái theo hướng dẫn của chị Hiếu. Thầy Việt khen mở đầu cuốn: \"nghe đã thấy hấp dẫn rồi. Chắc chắn là nói dối luônnnn - giọng em hay thế\".", "technical_blockers": "Chuyển cảnh chưa thật đúng bài bản, đang cố gắng hoàn thiện thêm dần dần.", "mindset_attitude": "Rất vui và biết ơn: \"Sau khi học khoá của thầy Việt và được chị Hiếu hướng dẫn thêm e thấy rất vui và xứng đáng vì quyết định đi học lớp mình là quá đúng đắn ạ.\"", "next_steps": "Tiếp tục hỗ trợ Vân Anh mài giũa kỹ thuật chuyển cảnh mượt hơn, giữ nguyên phong cách cảnh trám đời thường tự nhiên.", "screenshot_url": "tu_van_van_anh_02.png"}], "notes": "Học viên rất tiềm năng ngành Spa, giọng truyền cảm tự nhiên. Cần xin thêm SĐT và link Facebook cá nhân khi gặp buổi tới."}];
    let currentIndustry = 'all';
    let currentSearch = '';

    function init() {
      updateStats();
      renderIndustryPills();
      renderStudents();

      document.getElementById('search-input').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase().trim();
        renderStudents();
      });
    }

    function updateStats() {
      let complete = 0, warning = 0, critical = 0;
      STUDENTS.forEach(s => {
        if (s.completeness_score >= 100) complete++;
        else if (s.completeness_score >= 60) warning++;
        else critical++;
      });
      document.getElementById('stat-complete').innerText = complete;
      document.getElementById('stat-warning').innerText = warning;
      document.getElementById('stat-critical').innerText = critical;
    }

    function renderIndustryPills() {
      const container = document.getElementById('industry-filter-container');
      const indMap = {};
      STUDENTS.forEach(s => {
        const ind = s.industry || 'Khác';
        indMap[ind] = (indMap[ind] || 0) + 1;
      });

      Object.entries(indMap).forEach(([ind, count]) => {
        const btn = document.createElement('button');
        btn.className = 'ind-filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 transition';
        btn.dataset.ind = ind;
        btn.innerText = `${ind} (${count})`;
        btn.onclick = () => filterByIndustry(ind);
        container.appendChild(btn);
      });
    }

    function filterByIndustry(ind) {
      currentIndustry = ind;
      document.querySelectorAll('.ind-filter-btn').forEach(btn => {
        if (btn.dataset.ind === ind) {
          btn.className = 'ind-filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-white transition shadow-sm';
        } else {
          btn.className = 'ind-filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 transition';
        }
      });
      renderStudents();
    }

    function renderStudents() {
      const grid = document.getElementById('students-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML = '';

      const filtered = STUDENTS.filter(s => {
        const matchesInd = currentIndustry === 'all' || (s.industry && s.industry.toLowerCase() === currentIndustry.toLowerCase());
        const searchable = `${s.name} ${s.class} ${s.industry} ${s.notes} ${s.consultations ? s.consultations.map(c=>c.summary + ' ' + c.topic).join(' ') : ''}`.toLowerCase();
        const matchesSearch = !currentSearch || searchable.includes(currentSearch);
        return matchesInd && matchesSearch;
      });

      document.getElementById('showing-count').innerText = filtered.length;

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      emptyState.classList.add('hidden');

      filtered.forEach(s => {
        const card = document.createElement('div');
        card.className = 'p-5 sm:p-6 rounded-3xl bg-white border border-slate-200/90 hover:border-blue-400/80 hover:shadow-lg transition-all duration-200 cursor-pointer group shadow-[0_2px_8px_rgba(0,0,0,0.02)] flex flex-col sm:flex-row gap-5 items-start';
        card.onclick = () => openDrawer(s.id);

        // Visual Media Thumbnail (Video / Avatar preview)
        const mediaThumb = s.thumbnail_url || (s.videos && s.videos[1] && s.videos[1].thumbnail) || s.avatar_url || '';
        const mediaAvatar = s.avatar_url || '';
        const latestVideo = s.videos && s.videos.length > 0 ? s.videos[s.videos.length - 1] : null;

        // Health Status Badge
        let badgeHtml = '';
        if (s.completeness_score >= 100) {
          badgeHtml = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">🟢 Đầy đủ 100%</span>';
        } else if (s.completeness_score >= 60) {
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">🟠 Cần bổ sung (${s.completeness_score}%)</span>`;
        } else {
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200">🔴 Thiếu liên hệ (${s.completeness_score}%)</span>`;
        }

        // Missing Items warning pill
        let missingAlert = '';
        if (s.missing_items && s.missing_items.length > 0) {
          const items = s.missing_items.map(m => `• ${m.label}`).join(' ');
          missingAlert = `
            <div class="text-[11px] text-amber-800 bg-amber-50/80 border border-amber-200/60 px-3 py-1 rounded-xl flex items-center gap-1.5 font-medium">
              <span>⚠️ Đang thiếu:</span> <span>${items}</span>
            </div>
          `;
        }

        // Latest Consultation Quote
        let consHtml = '';
        if (s.consultations && s.consultations.length > 0) {
          const latest = s.consultations[s.consultations.length - 1];
          consHtml = `
            <div class="space-y-1">
              <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Tư vấn gần nhất (${latest.date}):</span>
              <p class="text-xs text-slate-700 line-clamp-2 leading-relaxed bg-slate-50 p-2.5 rounded-2xl border border-slate-100 font-medium">
                ${latest.summary}
              </p>
            </div>
          `;
        }

        // Drive Link Button
        let driveBtn = '';
        if (latestVideo && latestVideo.drive_url) {
          driveBtn = `
            <a href="${latestVideo.drive_url}" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold text-[11px] transition">
              <span>📁 Video trên Drive</span> ↗
            </a>
          `;
        }

        card.innerHTML = `
          <!-- Media Column (Left) -->
          <div class="relative shrink-0 w-full sm:w-44 h-48 sm:h-44 rounded-2xl overflow-hidden bg-slate-100 border border-slate-200/80 group-hover:shadow-md transition">
            <img src="${mediaThumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${s.name}" onerror="this.src='${mediaAvatar}'">
            ${latestVideo ? `
              <div class="absolute bottom-2 left-2 right-2 bg-slate-900/80 backdrop-blur-xs text-white text-[10px] font-bold px-2 py-1 rounded-lg flex items-center justify-between">
                <span>▶ Video thực hành</span>
                <span>${latestVideo.duration || '01:29'}</span>
              </div>
            ` : ''}
          </div>

          <!-- Content Column (Right) -->
          <div class="flex-1 min-w-0 space-y-3 w-full">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="text-base font-extrabold text-slate-900 group-hover:text-blue-600 transition">${s.name}</h3>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-700">${s.class || 'Khóa học'}</span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-100">${s.industry}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">${s.notes || ''}</p>
              </div>
              <div class="shrink-0 text-right">
                ${badgeHtml}
              </div>
            </div>

            ${missingAlert}
            ${consHtml}

            <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-400">
              <div class="flex items-center gap-2">
                <span>Video: <b class="text-slate-700">${s.videos ? s.videos.length : 0}</b></span>
                ${driveBtn}
              </div>
              <span class="text-blue-600 font-bold group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                Xem chi tiết & tư vấn ➔
              </span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openDrawer(studentId) {
      const s = STUDENTS.find(item => item.id === studentId);
      if (!s) return;

      document.getElementById('drawer-avatar').src = s.avatar_url || s.thumbnail_url || '';
      document.getElementById('drawer-name').innerText = s.name;
      document.getElementById('drawer-ind').innerText = s.industry;
      document.getElementById('drawer-sub').innerText = `Lớp: ${s.class || 'Chưa xếp'} • Hoàn thiện: ${s.completeness_score}%`;

      const body = document.getElementById('drawer-body');

      // Videos
      let videosHtml = '';
      if (s.videos && s.videos.length > 0) {
        videosHtml = s.videos.map(v => `
          <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-slate-900">${v.title} (${v.duration})</span>
              ${v.drive_url ? `<a href="${v.drive_url}" target="_blank" class="text-blue-600 hover:underline font-bold text-[11px]">📁 Mở Google Drive ↗</a>` : ''}
            </div>
            ${v.feedback ? `
              <div class="text-xs text-blue-900 bg-blue-50/80 border border-blue-100 p-2.5 rounded-xl font-medium leading-relaxed">
                💬 <b>Thầy Việt:</b> ${v.feedback}
              </div>
            ` : ''}
            <div class="overflow-hidden rounded-xl border border-slate-200 bg-black">
              <video controls src="${v.local_path || v.drive_url}" class="w-full max-h-72 object-contain bg-black" preload="metadata"></video>
            </div>
          </div>
        `).join('');
      } else {
        videosHtml = '<p class="text-slate-400 italic p-3 text-center bg-slate-50 rounded-2xl">Chưa có video thực hành nào.</p>';
      }

      // Timeline
      let consHtml = '';
      if (s.consultations && s.consultations.length > 0) {
        consHtml = s.consultations.map(c => `
          <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-200/60 pb-2">
              <span class="font-bold text-blue-700 text-xs">📅 ${c.date} • ${c.topic}</span>
              <span class="text-[10px] uppercase font-bold bg-white border border-slate-200 px-2 py-0.5 rounded-md text-slate-600">${c.channel}</span>
            </div>
            <p class="text-slate-800 text-xs leading-relaxed font-medium">${c.summary}</p>
            ${c.technical_blockers ? `<div class="text-[11px] text-amber-900 bg-amber-50/80 p-2.5 rounded-xl border border-amber-200/60"><b>⚠️ Vướng mắc:</b> ${c.technical_blockers}</div>` : ''}
            ${c.mindset_attitude ? `<div class="text-[11px] text-blue-900 bg-blue-50/80 p-2.5 rounded-xl border border-blue-200/60"><b>🧠 Tâm lý:</b> ${c.mindset_attitude}</div>` : ''}
            ${c.next_steps ? `<div class="text-[11px] text-emerald-900 bg-emerald-50/80 p-2.5 rounded-xl border border-emerald-200/60"><b>👉 Định hướng tiếp:</b> ${c.next_steps}</div>` : ''}
            ${c.screenshot_url ? `
              <div class="pt-2">
                <span class="text-[11px] font-semibold text-slate-500 block mb-1.5">Ảnh chụp tin nhắn tư vấn Zalo:</span>
                <img 
                  src="assets/hocvien/${c.screenshot_url}" 
                  onclick="openLightbox('assets/hocvien/${c.screenshot_url}')" 
                  class="w-full max-h-52 object-cover rounded-xl border border-slate-200 shadow-xs cursor-zoom-in hover:opacity-95 transition"
                >
              </div>
            ` : ''}
          </div>
        `).join('');
      }

      body.innerHTML = `
        <!-- Quick Contacts Card -->
        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Kênh kết nối & liên hệ:</span>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="p-3 rounded-xl bg-white border border-slate-200/60">
              <span class="text-slate-400 block text-[11px]">Số điện thoại / Zalo:</span>
              <span class="font-bold text-slate-800">${s.phone || '<i class="text-rose-500 font-normal">Chưa có (cần xin)</i>'}</span>
            </div>
            <div class="p-3 rounded-xl bg-white border border-slate-200/60">
              <span class="text-slate-400 block text-[11px]">Trang Facebook cá nhân:</span>
              <span class="font-bold text-slate-800">${s.facebook_url ? `<a href="${s.facebook_url}" target="_blank" class="text-blue-600 hover:underline">Mở Facebook ↗</a>` : '<i class="text-rose-500 font-normal">Chưa có link FB</i>'}</span>
            </div>
          </div>
        </div>

        <!-- Video Practices -->
        <div class="space-y-3">
          <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">🎬 Video thực hành (${s.videos ? s.videos.length : 0}):</h3>
          ${videosHtml}
        </div>

        <!-- Consultation History -->
        <div class="space-y-3">
          <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">🎙️ Lịch sử tư vấn & bối cảnh (${s.consultations ? s.consultations.length : 0}):</h3>
          ${consHtml}
        </div>
      `;

      document.getElementById('drawer-overlay').classList.remove('hidden');
      document.getElementById('drawer').classList.remove('translate-x-full');
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.add('hidden');
      document.getElementById('drawer').classList.add('translate-x-full');
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
      document.getElementById('lightbox').classList.add('flex');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.getElementById('lightbox').classList.remove('flex');
    }

    window.onload = init;
  </script>
</body>
</html>
