<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực TikTok Thành Công • VIDEO Video Manager</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%2307090E'/%3E%3Cpath%20d='M7%2053Q6.4%2053%206.1%2052.6Q5.9%2052.2%206.1%2051.6L11.1%2033.5L6.3%2016.1Q6.1%2015.5%206.4%2015.1Q6.6%2014.7%207.2%2014.7H13.8Q14.8%2014.7%2014.9%2015.8L16.9%2027.7H17.2L19.2%2015.8Q19.4%2014.7%2020.4%2014.7H26.9Q27.5%2014.7%2027.8%2015.1Q28%2015.5%2027.8%2016.1L23.1%2033.5L28%2051.6Q28.3%2052.2%2028%2052.6Q27.7%2053%2027.2%2053H20.6Q19.6%2053%2019.4%2051.9L17.2%2040.2H16.9L14.8%2051.9Q14.6%2053%2013.6%2053ZM34.7%2053Q33.7%2053%2033.7%2051.9V21.9H30.5Q29.4%2021.9%2029.4%2020.8V15.8Q29.4%2014.7%2030.5%2014.7H45.4Q46.5%2014.7%2046.5%2015.8V20.8Q46.5%2021.9%2045.4%2021.9H42.2V51.9Q42.2%2053%2041.2%2053Z'%20fill='%23FB923C'/%3E%3Ccircle%20cx='52'%20cy='13'%20r='4.2'%20fill='%23FB923C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060911;
      --card: #0c121e;
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .code-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--cyan);
      word-break: break-all;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Xác thực TikTok Thành Công!</h1>
    <p>Tài khoản TikTok của bạn đã cấp quyền thành công cho ứng dụng <b>VIDEO Video Manager</b>.</p>
    
    <div id="code-container" style="display:none;">
      <div style="font-size:12px; color:var(--muted); margin-bottom:6px; text-align:left;">MÃ XÁC THỰC (AUTH CODE):</div>
      <div id="auth-code" class="code-box"></div>
      <button class="btn" onclick="copyCode()">Sao chép Mã Xác Thực</button>
    </div>
    <div id="no-code" style="color:var(--muted); font-size:14px;">
      Bạn có thể quay lại terminal / Antigravity để tiếp tục tiến trình.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code-container').style.display = 'block';
      document.getElementById('no-code').style.display = 'none';
      document.getElementById('auth-code').innerText = code;
    }

    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        alert('Đã sao chép mã code vào clipboard!');
      });
    }
  </script>
</body>
</html>
