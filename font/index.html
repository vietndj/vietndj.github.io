<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://font.fedu.vn/#catalog">
  <link rel="canonical" href="https://font.fedu.vn/#catalog">
  <title>Đang chuyển hướng sang FEDU FONT (font.fedu.vn)...</title>
  <script>
    window.location.replace("https://font.fedu.vn/#catalog");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0d0e12;
      color: #f3f4f6;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00e599;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #fff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #9ca3af;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00e599;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    a.btn:hover {
      background: #00ffaa;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Đang chuyển hướng sang FEDU FONT</h1>
    <p>Hệ thống thư viện Font đã chuyển sang cổng chính thức <strong>font.fedu.vn</strong>.</p>
    <a href="https://font.fedu.vn/#catalog" class="btn">Truy cập font.fedu.vn →</a>
  </div>
</body>
</html>
